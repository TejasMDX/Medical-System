<html>

<body class="doctor-page">
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>

    <div>
        <p id="access_doctor">Log in as a doctor to access this page.</p>
    </div>

    <div id="doctor_dashboard">
        <h1>Doctor Dashboard</h1>

    <img src="images/image8.png">

    <p>Welcome to your doctor account.</p>

    <h2>My Appointments</h2>
    <p>View your upcoming appointments and patient details here.</p>

    <h2>Patient Records</h2>

    <label for="patient">Choose a Patient:</label>

    <select id="patient">
        <option value="">Select a patient</option>
    </select>

    <br><br>

    <button type="button">View Patient Records</button>

    <h2>Medical Notes and Treatments</h2>

    <p>Add medical notes and select a medicine for a patient.</p>

    <label for="medicine">Medicine Name:</label>

    <select id="medicine">
        <option value="">Select a medicine</option>
    </select>

    <br><br>

    <label for="notes">Medical Note:</label>
    <br>

    <textarea id="notes" rows="4"></textarea>

    <br><br>

    <button type="button">Save Note</button>
    </div>
 
    <script>

        // Open the existing CarePoint database.
        const doctorDBRequest = indexedDB.open("CarePointDatabase", 1);

        doctorDBRequest.onsuccess = function(event) {

            // Access the database.
            const doctorDB = event.target.result;

            // Start a transaction to read patient records.
            const transaction = doctorDB.transaction(["Patients"], "readonly");

            // Access the Patients object store.
            const patientsStore = transaction.objectStore("Patients");

            // Get all the patient records.
            const request = patientsStore.getAll();

            request.onsuccess = function() {

                const patients = request.result;

                // Access the patient dropdown.
                const patientDropdown = document.getElementById("patient");

                // Add patients to the dropdown.
                patients.forEach(function(patient) {

                    const option = document.createElement("option");

                    option.value = patient.id;
                    option.textContent = patient.First + " " + patient.Last;

                    patientDropdown.appendChild(option);

                });

            };

            transaction.oncomplete = function() {
                doctorDB.close();
            };


        };

            // Add medicines to the dropdown
            medicines.forEach(function(medicine) {
                const option = document.createElement("option");

                option.value = medicine.id;
                option.textContent = medicine.Drug;

                document.getElementById("medicine").appendChild(option);
            });


        loadData().catch(function(error) {
            console.log("Could not load the JSON files.", error);
        });
    </script>

</body>
</html>
