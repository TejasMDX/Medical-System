<!DOCTYPE html>
<html>
<head>
<title> Admin Portal </title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

        <a href="login.html" class="login-button">Login</a>
    </nav>

    <h1>Admin Dashboard</h1>

    <p>Welcome to your admin account.</p>

    <h2>Add Patient</h2>

    <p>Add a new patient's information below.</p>

    <form id="patientForm">

    <label for="nhsInput">NHS:</label>
    <input id="nhsInput" type="text" required>
    <br>

    <label for="titleInput">Title:</label>
    <input id="titleInput" type="text" required>
    <br>

    <label for="firstInput">First Name:</label>
    <input id="firstInput" type="text" required>
    <br>

    <label for="lastInput">Last Name:</label>
    <input id="lastInput" type="text" required>
    <br>

    <label for="dobInput">DOB:</label>
    <input id="dobInput" type="text" placeholder="DD/MM/YYYY" required>
    <br>

    <label for="genderInput">Gender:</label>
    <input id="genderInput" type="text" required>
    <br>

    <label for="addressInput">Address:</label>
    <input id="addressInput" type="text" required>
    <br>

    <label for="emailInput">Email:</label>
    <input id="emailInput" type="email" required>
    <br>

    <label for="telephoneInput">Telephone:</label>
    <input id="telephoneInput" type="text" required>
    <br>

    <button type="submit">Add patient</button>

    </form>

    <h2>Patient Records</h2>

    <p>View and manage registered patient information below.</p>
    <button onclick="showAllPatients()">Show Patients</button>
    <div id="output"></div>

    <script>
        let db = null;

        async function setupDatabase() {
                const response = await fetch("json/patients.json");

                db = await response.json();
        }

        setupDatabase();

        function showAllPatients() {
            const patients = Array.isArray(db) ? db : [db];

            let html = `<table border="1">
                <tr>
                    <th>ID</th>
                    <th>NHS</th>
                    <th>Title</th>
                    <th>First</th>
                    <th>Last</th>
                    <th>DOB</th>
                    <th>Gender</th>
                    <th>Address</th>
                    <th>Email</th>
                    <th>Telephone</th>
                </tr>`;

            patients.forEach(p => {
                html += `<tr>
                    <td>${p.id}</td>
                    <td>${p.NHS}</td>
                    <td>${p.Title}</td>
                    <td>${p.First}</td>
                    <td>${p.Last}</td>
                    <td>${p.DOB}</td>
                    <td>${p.Gender}</td>
                    <td>${p.Address}</td>
                    <td>${p.Email}</td>
                    <td>${p.Telephone}</td>
                </tr>`;
            });

            html += `</table>`;

            document.getElementById("output").innerHTML = html;
        }

        function addPatient() {
        document.getElementById("patientForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const patient = {
                id: Math.max(0, ...db.map(p => Number(p.id) || 0)) + 1,
                NHS: document.getElementById("nhsInput").value.trim(),
                Title: document.getElementById("titleInput").value.trim(),
                First: document.getElementById("firstInput").value.trim(),
                Last: document.getElementById("lastInput").value.trim(),
                DOB: document.getElementById("dobInput").value.trim(),
                Gender: document.getElementById("genderInput").value.trim(),
                Address: document.getElementById("addressInput").value.trim(),
                Email: document.getElementById("emailInput").value.trim(),
                Telephone: document.getElementById("telephoneInput").value.trim()
            };

            db.push(patient);

            localStorage.setItem("patients", JSON.stringify(db));

            document.getElementById("patientForm").reset();


        });
        }
        addPatient();
        showAllPatients();
</script>

</body>
</html>
