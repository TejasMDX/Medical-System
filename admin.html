<!DOCTYPE html>
<html>
<head>
<title> Admin Portal </title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

        <a href="login.html" class="login-button">Login</a>
    </nav>

    <h1>Admin Dashboard</h1>

    <p>Welcome to your admin account.</p>

    <h2>Add Patient</h2>

    <p>Add a new patient's information below.</p>

    <h2>Patient Records</h2>

    <p>View and manage registered patient information below.</p>
    <button onclick="showAllPatients()">Show Patients</button>
    <div id="output"></div>

    <script>
        let db = null;

        async function setupDatabase() {
                const response = await fetch("json/patients.json");

                db = await response.json();
        }

        setupDatabase();

        function showAllPatients() {
            const patients = Array.isArray(db) ? db : [db];

            let html = `<table border="1">
                <tr>
                    <th>ID</th>
                    <th>NHS</th>
                    <th>Title</th>
                    <th>First</th>
                    <th>Last</th>
                    <th>DOB</th>
                    <th>Gender</th>
                    <th>Address</th>
                    <th>Email</th>
                    <th>Telephone</th>
                </tr>`;

            patients.forEach(p => {
                html += `<tr>
                    <td>${p.id}</td>
                    <td>${p.NHS}</td>
                    <td>${p.Title}</td>
                    <td>${p.First}</td>
                    <td>${p.Last}</td>
                    <td>${p.DOB}</td>
                    <td>${p.Gender}</td>
                    <td>${p.Address}</td>
                    <td>${p.Email}</td>
                    <td>${p.Telephone}</td>
                </tr>`;
            });

            html += `</table>`;

            document.getElementById("output").innerHTML = html;
        }
</script>

</body>
</html>
