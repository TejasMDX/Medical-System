<!DOCTYPE html>
<html>
<head>
    <!-- Sets the title displayed on the browser tab -->
    <title>Login Page</title>

    <!-- Links the external CSS file to style the page -->
    <link rel="stylesheet" href="style.css">

    <!-- Loads AES-256 encryption before the login script -->
    <script src="encryption.js"></script>
</head>

<body class="login-page">

    <!-- Container for the login form -->
    <div class="login-container">

        <h1>Login</h1>

        <!-- Form containing the admin's login details -->
        <form id="adminLoginForm">

            <!-- Username field -->
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <br><br>

            <!-- Password field -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <br><br>

            <!-- Login button -->
            <button type="submit">Login</button>

            <!-- Message displayed when login fails or succeeds -->
            <p id="loginMessage"></p>

        </form>

    </div>

    <!-- Loads the admin login JavaScript file -->
    <script src="adminlogin.js"></script>

</body>
</html>
