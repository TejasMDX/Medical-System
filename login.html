
<!DOCTYPE html>
<html>
<head>
    <!-- Set the title displayed on the browser tab -->
    <title> Login Page </title>

    <!-- Link the external CSS file to style the page -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- Apply the login-page CSS class for styling -->
<body class="login-page">

    <!-- Container for the login form -->
    <div class="login-container">

        <!-- Main heading of the page -->
        <h1>Login</h1>

        <!-- Form containing the user's login details -->
        <form id="LoginForm">

            <!-- Label and input field for the user's email address -->
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <!-- Add spacing between the email and password fields -->
            <br><br>

            <!-- Label and input field for the user's password -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <!-- Add spacing before the Login button -->
            <br><br>

            <!-- Login button -->
            <button type="submit">Login</button>

            <!-- Display login messages -->
            <p id="loginMessage"></p>

        </form>

        <!-- Display a registration message and link -->
        <p>Don't have an account?
        <a href="register.html">Register here</a></p>

        <p>Administrator Login?
        <a href="adminlogin.html">Click here</a></p>

    </div>

    <!-- Load the patient login JavaScript file -->
    <script src="login.js"></script>

</body>
</html>
